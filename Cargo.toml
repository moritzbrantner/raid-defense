[workspace]
members = [
    "crates/raid-defense-core",
    "crates/raid-defense-sim",
    "crates/raid-defense-wasm",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
collection-kernels = { git = "https://github.com/moritzbrantner/rust-kernels", rev = "89731e09e2cd639edcd04b88f97c1c76e4c2c5cb" }
serde = "=1.0.229"
serde_json = "=1.0.154"
wasm-bindgen = "=0.2.129"
