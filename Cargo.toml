[workspace]
members = [
    "crates/raid-defense-core",
    "crates/raid-defense-ecs",
    "crates/raid-defense-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
ecs-sparse-set = { git = "https://github.com/moritzbrantner/ecs-lab", rev = "023333452c4fb1493ec34d2cae6c8051c6340991" }
ecs-workload = { git = "https://github.com/moritzbrantner/ecs-lab", rev = "023333452c4fb1493ec34d2cae6c8051c6340991" }
serde = "=1.0.229"
serde_json = "=1.0.151"
wasm-bindgen = "=0.2.128"
