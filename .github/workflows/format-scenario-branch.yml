name: Format scenario branch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'scenario-editor-explicit-waves'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scenario branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: scenario-editor-explicit-waves

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt

      - name: Format Rust workspace
        run: cargo fmt --all

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates
          git commit -m "Format scenario editor Rust"
          git push origin HEAD:scenario-editor-explicit-waves
