name: Apply game-rules refactor

on:
  push:
    branches:
      - refactor/game-rules
    paths:
      - .github/workflows/apply-game-rules-refactor.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full branch history
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
          ref: refactor/game-rules

      - name: Configure repository writer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Reconcile latest main
        run: |
          git fetch origin main
          git merge --no-edit origin/main

      - name: Repair and validate migration script
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/apply_game_rules_refactor.py")
          text = path.read_text()
          old = '''if core.count("                    speed_milli: PERSON_SPEED_MILLI,\\n") != 2:
              raise SystemExit(f"person speed rules: expected 2 matches, found {core.count('                    speed_milli: PERSON_SPEED_MILLI,\\\\n')}")
          core = core.replace("                    speed_milli: PERSON_SPEED_MILLI,\\n", "                    speed_milli: self.rules.population.speed_milli,\\n", 2)'''
          new = '''person_speed_pattern = "                    speed_milli: PERSON_SPEED_MILLI,\\n"
          person_speed_count = core.count(person_speed_pattern)
          if person_speed_count != 2:
              raise SystemExit(
                  f"person speed rules: expected 2 matches, found {person_speed_count}"
              )
          core = core.replace(
              person_speed_pattern,
              "                    speed_milli: self.rules.population.speed_milli,\\n",
              2,
          )'''
          if old not in text:
              raise SystemExit("expected person-speed migration block was not found")
          path.write_text(text.replace(old, new, 1))
          PY
          python3 -m py_compile tools/apply_game_rules_refactor.py

      - name: Apply rules migration
        run: python3 tools/apply_game_rules_refactor.py

      - name: Format Rust workspace
        run: cargo fmt --all

      - name: Remove one-shot migration machinery
        run: |
          rm tools/apply_game_rules_refactor.py
          rm .github/workflows/apply-game-rules-refactor.yml

      - name: Commit generated refactor
        run: |
          git add -A
          git diff --cached --check
          git commit -m "Route simulation through immutable game rules"
          git push origin HEAD:refactor/game-rules
