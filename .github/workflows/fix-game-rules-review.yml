name: Fix game-rules review findings

on:
  push:
    branches:
      - refactor/game-rules
    paths:
      - .github/workflows/fix-game-rules-review.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: refactor/game-rules

      - name: Route raid damage increment through rules
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("crates/raid-defense-core/src/lib.rs")
          text = path.read_text()

          pattern = re.compile(
              r"        let damage_bonus = u16::try_from\(self\.wave / self\.rules\.raids\.damage_increase_every_waves\)\n"
              r"\s+\.unwrap_or\(u16::MAX\);\n"
          )
          replacement = (
              "        let damage_steps =\n"
              "            u16::try_from(self.wave / self.rules.raids.damage_increase_every_waves)\n"
              "                .unwrap_or(u16::MAX);\n"
              "        let damage_bonus =\n"
              "            damage_steps.saturating_mul(self.rules.raids.damage_increase_amount);\n"
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"expected exactly one raid damage scaling block, found {count}")

          old_test = (
              "        rules.buildings.house.people_added = 1;\n"
              "        rules.cycle.day_length_ticks = 2;\n"
          )
          new_test = old_test + (
              "        rules.raids.damage_increase_every_waves = 1;\n"
              "        rules.raids.damage_increase_amount = 7;\n"
          )
          if text.count(old_test) != 1:
              raise SystemExit("custom-rules test setup was not found exactly once")
          text = text.replace(old_test, new_test, 1)

          old_assert = (
              "        assert_eq!(\n"
              "            state.raider_count(),\n"
              "            usize::from(rules.raids.raiders_per_wave)\n"
              "        );\n"
          )
          new_assert = old_assert + (
              "        for entity in state.raiders.keys().map(key_entity) {\n"
              "            assert_eq!(\n"
              "                state\n"
              "                    .attacks\n"
              "                    .get(entity_key(entity))\n"
              "                    .expect(\"spawned raiders have an attack\")\n"
              "                    .damage,\n"
              "                rules.raids.base_damage + rules.raids.damage_increase_amount\n"
              "            );\n"
              "        }\n"
          )
          if text.count(old_assert) != 1:
              raise SystemExit("custom-rules raider assertion was not found exactly once")
          text = text.replace(old_assert, new_assert, 1)

          path.write_text(text)
          PY

      - name: Format and commit
        run: |
          cargo fmt --all
          rm .github/workflows/fix-game-rules-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Make rule invariants explicit"
          git push origin HEAD:refactor/game-rules
