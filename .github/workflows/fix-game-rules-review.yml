name: Fix game-rules review findings

on:
  push:
    branches:
      - refactor/game-rules
    paths:
      - .github/workflows/fix-game-rules-review.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: refactor/game-rules

      - name: Route raid damage increment through rules
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/raid-defense-core/src/lib.rs")
          text = path.read_text()

          old = '''        let damage_bonus = u16::try_from(self.wave / self.rules.raids.damage_increase_every_waves)
              .unwrap_or(u16::MAX);
          '''
          new = '''        let damage_steps =
              u16::try_from(self.wave / self.rules.raids.damage_increase_every_waves)
                  .unwrap_or(u16::MAX);
          let damage_bonus = damage_steps.saturating_mul(self.rules.raids.damage_increase_amount);
          '''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one raid damage scaling block")
          text = text.replace(old, new, 1)

          old_test = '''        rules.buildings.house.people_added = 1;
              rules.cycle.day_length_ticks = 2;
          '''
          new_test = '''        rules.buildings.house.people_added = 1;
              rules.cycle.day_length_ticks = 2;
              rules.raids.damage_increase_every_waves = 1;
              rules.raids.damage_increase_amount = 7;
          '''
          if text.count(old_test) != 1:
              raise SystemExit("custom-rules test setup was not found")
          text = text.replace(old_test, new_test, 1)

          old_assert = '''        assert_eq!(
              state.raider_count(),
              usize::from(rules.raids.raiders_per_wave)
          );
          '''
          new_assert = '''        assert_eq!(
              state.raider_count(),
              usize::from(rules.raids.raiders_per_wave)
          );
          for entity in state.raiders.keys().map(key_entity) {
              assert_eq!(
                  state
                      .attacks
                      .get(entity_key(entity))
                      .expect("spawned raiders have an attack")
                      .damage,
                  rules.raids.base_damage + rules.raids.damage_increase_amount
              );
          }
          '''
          if text.count(old_assert) != 1:
              raise SystemExit("custom-rules raider assertion was not found")
          text = text.replace(old_assert, new_assert, 1)

          path.write_text(text)
          PY

      - name: Format and commit
        run: |
          cargo fmt --all
          rm .github/workflows/fix-game-rules-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Make rule invariants explicit"
          git push origin HEAD:refactor/game-rules
