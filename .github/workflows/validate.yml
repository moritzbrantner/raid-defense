name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Format v2 core
        run: cargo fmt --manifest-path v2/Cargo.toml --all -- --check

      - name: Lint v2 core
        run: cargo clippy --manifest-path v2/Cargo.toml --all-targets -- -D warnings

      - name: Test v2 core
        run: cargo test --manifest-path v2/Cargo.toml --all-targets

  integration:
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Test legacy simulation while migration is active
        run: cargo test --workspace --locked

      - name: Exercise legacy opening campaign boundary
        run: cargo run --locked --example opening_campaign

  workflow:
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      - name: Install browser dependencies
        working-directory: visualization
        run: bun install --frozen-lockfile

      - name: Build browser workflow
        working-directory: visualization
        run: bun run build

  e2e:
    needs: workflow
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      - name: Install browser dependencies
        working-directory: visualization
        run: bun install --frozen-lockfile

      - name: Install Chromium
        working-directory: visualization
        run: bunx playwright install --with-deps chromium

      - name: Run browser acceptance
        working-directory: visualization
        run: bun run e2e
