name: Implement day-night cycle

on:
  push:
    branches:
      - feature/day-night-cycle

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch authoritative simulation
        run: python .github/scripts/implement_day_night.py
      - name: Format
        run: cargo fmt --all
      - name: Test authoritative Rust workspace
        run: cargo test --workspace
      - name: Verify patch cleanliness
        run: git diff --check
      - name: Commit implementation and remove bootstrap files
        run: |
          rm .github/workflows/implement-day-night.yml
          rm .github/scripts/implement_day_night.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add deterministic day and night cycle"
          git push origin HEAD:feature/day-night-cycle
