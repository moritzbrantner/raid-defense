name: Implement day-night cycle

on:
  push:
    branches:
      - feature/day-night-cycle

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch authoritative simulation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("crates/raid-defense-core/src/lib.rs")
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              "pub const TOWN_MAX_HEALTH: u16 = 250;\n",
              "pub const TOWN_MAX_HEALTH: u16 = 250;\npub const DAY_LENGTH_TICKS: u16 = 600;\n",
          )
          replace_once(
              "    completed_waves: u32,\n    next_entity: EntityId,\n",
              "    completed_waves: u32,\n    day_ticks_remaining: u16,\n    next_entity: EntityId,\n",
          )
          replace_once(
              "            completed_waves: 0,\n            next_entity: 1,\n",
              "            completed_waves: 0,\n            day_ticks_remaining: DAY_LENGTH_TICKS,\n            next_entity: 1,\n",
          )
          replace_once(
              "    pub const fn completed_waves(&self) -> u32 {\n        self.completed_waves\n    }\n\n    #[must_use]\n    pub fn houses_unlocked(&self) -> bool {\n",
              "    pub const fn completed_waves(&self) -> u32 {\n        self.completed_waves\n    }\n\n    #[must_use]\n    pub const fn day_ticks_remaining(&self) -> u16 {\n        self.day_ticks_remaining\n    }\n\n    #[must_use]\n    pub fn is_night(&self) -> bool {\n        self.raider_count() != 0\n    }\n\n    #[must_use]\n    pub fn houses_unlocked(&self) -> bool {\n",
          )
          replace_once(
              "        feed_u64(&mut hash, u64::from(self.completed_waves));\n        feed_u64(&mut hash, u64::from(self.next_entity));\n",
              "        feed_u64(&mut hash, u64::from(self.completed_waves));\n        feed_u16(&mut hash, self.day_ticks_remaining);\n        feed_u64(&mut hash, u64::from(self.next_entity));\n",
          )
          replace_once(
              "        self.wave = self.wave.saturating_add(1);\n",
              "        self.day_ticks_remaining = 0;\n        self.wave = self.wave.saturating_add(1);\n",
          )

          old_advance = '''    fn advance_tick(&mut self) -> Event {
        self.tick = self.tick.saturating_add(1);
        let had_raiders = self.raider_count() > 0;
        let wood_produced = self.run_resource_production_system();
        let (wood_picked_up, wood_delivered) = self.run_person_logistics_system();
        let shots = self.run_tower_attack_system();
        let (impacts, killed) = self.run_projectile_system();
        let kills = u16::try_from(killed.len()).unwrap_or(u16::MAX);
        for entity in killed {
            self.despawn_raider(entity);
        }
        let (wood_stolen, town_damage) = self.run_raider_movement_system();
        let completed_wave =
            if had_raiders && self.raider_count() == 0 && self.completed_waves < self.wave {
                self.completed_waves = self.wave;
                Some(self.wave)
            } else {
                None
            };

        Event::TickAdvanced {
            tick: self.tick,
            shots,
            impacts,
            kills,
            wood_produced,
            wood_picked_up,
            wood_delivered,
            wood_stolen,
            town_damage,
            completed_wave,
        }
    }
'''
          new_advance = '''    fn advance_tick(&mut self) -> Event {
        self.tick = self.tick.saturating_add(1);
        let had_raiders = self.raider_count() > 0;
        let (wood_produced, wood_picked_up, wood_delivered) = if had_raiders {
            (0, 0, 0)
        } else {
            let wood_produced = self.run_resource_production_system();
            let (wood_picked_up, wood_delivered) = self.run_person_logistics_system();
            (wood_produced, wood_picked_up, wood_delivered)
        };

        let mut wave_active_this_tick = had_raiders;
        if !had_raiders {
            self.day_ticks_remaining = self.day_ticks_remaining.saturating_sub(1);
            if self.day_ticks_remaining == 0 && self.town_health() > 0 {
                self.start_wave()
                    .expect("an expired peaceful day can always begin its next wave");
                wave_active_this_tick = true;
            }
        }

        let shots = self.run_tower_attack_system();
        let (impacts, killed) = self.run_projectile_system();
        let kills = u16::try_from(killed.len()).unwrap_or(u16::MAX);
        for entity in killed {
            self.despawn_raider(entity);
        }
        let (wood_stolen, town_damage) = self.run_raider_movement_system();
        let completed_wave = if wave_active_this_tick
            && self.raider_count() == 0
            && self.completed_waves < self.wave
        {
            self.completed_waves = self.wave;
            self.day_ticks_remaining = DAY_LENGTH_TICKS;
            Some(self.wave)
        } else {
            None
        };

        Event::TickAdvanced {
            tick: self.tick,
            shots,
            impacts,
            kills,
            wood_produced,
            wood_picked_up,
            wood_delivered,
            wood_stolen,
            town_damage,
            completed_wave,
        }
    }
'''
          replace_once(old_advance, new_advance)

          tests_anchor = '''    #[test]
    fn replay_includes_deterministic_people_logistics() {
'''
          tests = '''    #[test]
    fn first_night_starts_after_sixty_seconds_of_day_ticks() {
        let mut state = GameState::new(7);

        for _ in 0..DAY_LENGTH_TICKS - 1 {
            state
                .apply(Command::AdvanceTick)
                .expect("day tick should advance");
        }

        assert_eq!(state.wave(), 0);
        assert_eq!(state.raider_count(), 0);
        assert_eq!(state.day_ticks_remaining(), 1);
        assert!(!state.is_night());

        state
            .apply(Command::AdvanceTick)
            .expect("last day tick should begin the night");

        assert_eq!(state.wave(), 1);
        assert_eq!(state.raider_count(), 4);
        assert_eq!(state.day_ticks_remaining(), 0);
        assert!(state.is_night());
    }

    #[test]
    fn night_pauses_production_and_person_logistics() {
        let mut state = GameState::new(13);
        state
            .apply(Command::PlaceSawmill { x: 2, z: 2 })
            .expect("sawmill should build");
        let sawmill = sawmill_entity(&state);
        state
            .storage
            .get_mut(entity_key(sawmill))
            .expect("sawmill should have storage")
            .wood = u32::from(PERSON_CARRY_CAPACITY);
        state.run_person_logistics_system();
        state.day_ticks_remaining = 1;

        state
            .apply(Command::AdvanceTick)
            .expect("last day tick should begin the night");
        assert!(state.is_night());

        let producer_before = *state
            .producers
            .get(entity_key(sawmill))
            .expect("sawmill should have a producer");
        let person = state
            .people
            .iter()
            .find_map(|(key, person)| {
                (person.state != PersonState::IdleAtTownHall).then_some(key_entity(key))
            })
            .expect("a carrier should be active before night");
        let person_before = *state
            .people
            .get(entity_key(person))
            .expect("person should exist");
        let movement_before = *state
            .movements
            .get(entity_key(person))
            .expect("active carrier should have movement");
        let transform_before = *state
            .transforms
            .get(entity_key(person))
            .expect("person should have a transform");

        let Event::TickAdvanced {
            wood_produced,
            wood_picked_up,
            wood_delivered,
            ..
        } = state
            .apply(Command::AdvanceTick)
            .expect("night tick should advance")
        else {
            unreachable!();
        };

        assert_eq!(wood_produced, 0);
        assert_eq!(wood_picked_up, 0);
        assert_eq!(wood_delivered, 0);
        assert_eq!(
            *state
                .producers
                .get(entity_key(sawmill))
                .expect("sawmill should still have a producer"),
            producer_before
        );
        assert_eq!(
            *state
                .people
                .get(entity_key(person))
                .expect("person should still exist"),
            person_before
        );
        assert_eq!(
            *state
                .movements
                .get(entity_key(person))
                .expect("carrier movement should remain paused"),
            movement_before
        );
        assert_eq!(
            *state
                .transforms
                .get(entity_key(person))
                .expect("carrier position should remain paused"),
            transform_before
        );
    }

    #[test]
    fn replay_includes_deterministic_people_logistics() {
'''
          replace_once(tests_anchor, tests)

          replace_once(
              "        state.wave = HOUSE_UNLOCK_COMPLETED_WAVES;\n        state.completed_waves = HOUSE_UNLOCK_COMPLETED_WAVES - 1;\n        state.spawn_raider(Edge::North);\n",
              "        state.wave = HOUSE_UNLOCK_COMPLETED_WAVES;\n        state.completed_waves = HOUSE_UNLOCK_COMPLETED_WAVES - 1;\n        state.day_ticks_remaining = 0;\n        state.spawn_raider(Edge::North);\n",
          )
          replace_once(
              "        assert_eq!(completed_wave, Some(HOUSE_UNLOCK_COMPLETED_WAVES));\n        assert!(state.houses_unlocked());\n",
              "        assert_eq!(completed_wave, Some(HOUSE_UNLOCK_COMPLETED_WAVES));\n        assert_eq!(state.day_ticks_remaining(), DAY_LENGTH_TICKS);\n        assert!(!state.is_night());\n        assert!(state.houses_unlocked());\n",
          )

          path.write_text(text)
          PY
      - name: Format
        run: cargo fmt --all
      - name: Test authoritative Rust workspace
        run: cargo test --workspace
      - name: Verify patch cleanliness
        run: git diff --check
      - name: Commit implementation and remove bootstrap workflow
        shell: bash
        run: |
          rm .github/workflows/implement-day-night.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add deterministic day and night cycle"
          git push origin HEAD:feature/day-night-cycle
