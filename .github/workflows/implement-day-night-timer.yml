name: Implement day-night timer

on:
  push:
    branches:
      - feature/day-night-timer

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Patch authoritative timer boundary and browser UI
        run: python .github/scripts/implement_day_night_timer.py

      - name: Format Rust workspace
        run: cargo fmt --all

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      - name: Install browser dependencies
        working-directory: visualization
        run: bun install --frozen-lockfile

      - name: Lint browser boundary
        working-directory: visualization
        run: bun run lint

      - name: Build Rust/WASM/browser workflow
        working-directory: visualization
        run: bun run build

      - name: Install Chromium
        working-directory: visualization
        run: bunx playwright install --with-deps chromium

      - name: Run browser acceptance
        working-directory: visualization
        run: bun run e2e

      - name: Verify patch cleanliness
        run: git diff --check

      - name: Commit implementation and remove bootstrap files
        shell: bash
        run: |
          rm .github/workflows/implement-day-night-timer.yml
          rm .github/scripts/implement_day_night_timer.py
          rm -f Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Show authoritative day and night timer"
          git push origin HEAD:feature/day-night-timer
