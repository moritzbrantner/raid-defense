name: Apply streaming tower targeting

on:
  push:
    branches: [perf/stream-tower-targeting]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/stream-tower-targeting
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Apply targeting optimization
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          old = base64.b64decode('').decode()
          new = base64.b64decode('').decode()
          combat = Path('crates/raid-defense-core/src/state_combat.rs')
          text = combat.read_text()
          if text.count(old) != 1:
              raise SystemExit('expected exactly one target_for_tower implementation')
          combat.write_text(text.replace(old, new))

          marker = base64.b64decode('ICAgICNbdGVzdF0KICAgIGZuIGludGVnZXJfc3F1YXJlX3Jvb3RfaXNfZGV0ZXJtaW5pc3RpY19hdF9ib3VuZGFyaWVzKCkgewo=').decode()
          addition = base64.b64decode('').decode()
          tests = Path('crates/raid-defense-core/src/core_tests.rs')
          text = tests.read_text()
          if text.count(marker) != 1:
              raise SystemExit('expected integer-square-root test marker')
          tests.write_text(text.replace(marker, addition + marker))
          PY
          cargo fmt --all
      - name: Validate optimization
        run: |
          cargo test -p raid-defense-core
          cargo clippy -p raid-defense-core --all-targets -- -D warnings
          bash scripts/benchmark-simulation.sh 1
      - name: Commit patch and remove helper
        shell: bash
        run: |
          rm .github/workflows/apply-stream-tower-targeting.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/raid-defense-core/src/state_combat.rs crates/raid-defense-core/src/core_tests.rs .github/workflows/apply-stream-tower-targeting.yml
          git commit -m "perf(combat): stream tower target selection"
          git push origin HEAD:perf/stream-tower-targeting
