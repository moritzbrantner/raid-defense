name: Dogfood dependency lock

on:
  push:
    branches: [feat/shared-settings-ui-bridge]

permissions:
  contents: write
  packages: read

env:
  GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
  NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: feat/shared-settings-ui-bridge
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Regenerate exact browser dependency lock
        working-directory: visualization
        run: bun install
      - name: Commit lockfile
        run: |
          if git diff --quiet -- visualization/bun.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visualization/bun.lock
          git commit -m "Relock shared settings UI dependencies"
          git push origin HEAD:feat/shared-settings-ui-bridge
