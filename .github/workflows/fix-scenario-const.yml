name: Fix scenario const validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'scenario-editor-explicit-waves'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scenario branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: scenario-editor-explicit-waves

      - name: Repair const-safe conversions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/raid-defense-core/src/rules.rs')
          content = path.read_text()
          content = content.replace('total = total.saturating_add(u32::from(group.count));', 'total = total.saturating_add(group.count as u32);')
          content = content.replace('if total > u32::from(u16::MAX) {', 'if total > u16::MAX as u32 {')
          path.write_text(content)
          PY

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt

      - name: Format Rust workspace
        run: cargo fmt --all

      - name: Commit repair
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/raid-defense-core/src/rules.rs
          git commit -m "Use const-safe wave count validation"
          git push origin HEAD:scenario-editor-explicit-waves
