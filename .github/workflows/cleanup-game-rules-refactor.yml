name: Clean game-rules refactor

on:
  push:
    branches:
      - refactor/game-rules
    paths:
      - .github/workflows/cleanup-game-rules-refactor.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: refactor/game-rules

      - name: Remove obsolete aliases and lint annotation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          core_path = Path("crates/raid-defense-core/src/lib.rs")
          core = core_path.read_text()
          obsolete = '''const TOWER_MAX_HEALTH: u16 = STANDARD_RULES.towers.max_health;
          const SAWMILL_MAX_HEALTH: u16 = STANDARD_RULES.buildings.sawmill.max_health;
          const HOUSE_MAX_HEALTH: u16 = STANDARD_RULES.buildings.house.max_health;
          const PERSON_MAX_HEALTH: u16 = STANDARD_RULES.population.person_health;
          const RAIDER_BASE_HEALTH: u16 = STANDARD_RULES.raids.base_health;
          const RAIDER_BASE_DAMAGE: u16 = STANDARD_RULES.raids.base_damage;
          const RAIDER_SPEED_MILLI: u16 = STANDARD_RULES.raids.speed_milli;
          const RAIDER_BASE_WOOD_STEAL: u32 = STANDARD_RULES.raids.base_wood_steal;
          '''
          if obsolete not in core:
              raise SystemExit("obsolete private rules alias block was not found")
          core = core.replace(obsolete, "", 1)
          core = core.replace(
              "speed_milli: RAIDER_SPEED_MILLI,",
              "speed_milli: STANDARD_RULES.raids.speed_milli,",
          )
          core_path.write_text(core)

          rules_path = Path("crates/raid-defense-core/src/rules.rs")
          rules = rules_path.read_text()
          old = "    #[must_use]\n    pub const fn validate(self) -> Result<(), RulesError> {"
          new = "    pub const fn validate(self) -> Result<(), RulesError> {"
          if old not in rules:
              raise SystemExit("rules validate annotation was not found")
          rules_path.write_text(rules.replace(old, new, 1))
          PY

      - name: Format and commit
        run: |
          cargo fmt --all
          rm .github/workflows/cleanup-game-rules-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove obsolete balance aliases"
          git push origin HEAD:refactor/game-rules
