schema_version = 1

[policy]
track = "latest-stable"

[system]
apt = []

[setup]
commands = ["cd visualization && bun install --frozen-lockfile"]

[maintenance]
commands = ["cd visualization && bun install --frozen-lockfile"]

[cache]
paths = ["~/.bun/install/cache", "~/.cargo/registry", "~/.cargo/git"]

[compatibility_holds]
